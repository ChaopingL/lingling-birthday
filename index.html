<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>生日快乐，玲玲宝贝</title>
<meta name="description" content="送给玲玲宝贝的生日小页面，敲一敲风铃吧。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23E0577A' d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --blush: #FBE7EA;
    --paper: #FFF6F4;
    --ink: #4A1A2C;
    --ink-soft: #8A4A5E;
    --string: #B9788A;
    --rose: #E0577A;
    --pink: #F4A3B7;
    --gold: #E9BC6C;
    --serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", Georgia, serif;
    --sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --blush: #24101A;
      --paper: #341A28;
      --ink: #FBE7EA;
      --ink-soft: #E0A9B9;
      --string: #C98599;
    }
  }
  :root[data-theme="dark"] {
    --blush: #24101A;
    --paper: #341A28;
    --ink: #FBE7EA;
    --ink-soft: #E0A9B9;
    --string: #C98599;
  }
  html { background: var(--blush); scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0;
    background: var(--blush);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- stage: beam, chimes, name ---------- */
  .stage { text-align: center; padding: 0 1rem 3.5rem; overflow: hidden; }
  .beam {
    height: 8px;
    max-width: 760px;
    margin: 1.75rem auto 0;
    border-radius: 4px;
    background: var(--string);
  }
  .chimes {
    list-style: none;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    max-width: 680px;
    margin: -2px auto 0;
    padding: 0 0.5rem;
    min-height: 15rem;
  }
  .chime {
    transform-origin: 50% 0;
    animation: sway var(--dur, 6s) ease-in-out var(--delay, 0s) infinite alternate;
  }
  .hang {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: none;
    border: 0;
    padding: 0 0 6px;
    cursor: pointer;
    color: inherit;
    transform-origin: 50% 0;
    -webkit-tap-highlight-color: transparent;
  }
  .hang:focus-visible { outline: 3px solid var(--rose); outline-offset: 6px; border-radius: 14px; }
  .hang.ring { animation: swing 2.6s cubic-bezier(.2,.6,.3,1) 1; }
  .string { width: 2px; height: var(--len); background: var(--string); }
  .bell { width: 64px; height: 76px; display: block; overflow: visible; }
  .bell .body { fill: var(--c); }
  .bell .rim { fill: var(--c); filter: brightness(.86); }
  .bell .shine { fill: #fff; opacity: .3; }
  .bell .clapper { fill: var(--rose); }
  .bell text { font-family: var(--serif); font-weight: 700; font-size: 20px; text-anchor: middle; fill: var(--tc); }

  h1 {
    font-family: var(--serif);
    font-weight: 700;
    font-size: clamp(3.5rem, 18vw, 7.5rem);
    letter-spacing: 0.08em;
    text-indent: 0.08em;
    line-height: 1.1;
    margin: 1.25rem 0 0;
  }

  .beat {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.9rem;
    margin: 0.9rem auto 0;
    max-width: 16rem;
    color: var(--rose);
  }
  .beat::before, .beat::after { content: ""; flex: 1; height: 1px; background: var(--string); opacity: .6; }
  .beat svg { width: 22px; height: 22px; animation: beat 1.6s ease-in-out infinite; }

  .hello { margin: 0.9rem 0 0; }
  .hello .zh { display: block; font-family: var(--serif); font-size: 1.5rem; letter-spacing: 0.3em; text-indent: 0.3em; }
  .hello .sub { display: block; color: var(--ink-soft); font-size: 1.05rem; margin-top: 0.15rem; }

  .wish {
    max-width: 30rem;
    min-height: 7rem;
    margin: 2.25rem auto 0;
    padding: 1.25rem 1.5rem;
    background: var(--paper);
    border-radius: 24px;
  }
  .wish-zh { font-family: var(--serif); font-weight: 700; font-size: 1.75rem; margin: 0; letter-spacing: 0.15em; }
  .wish-line { margin: 0.25rem 0 0; color: var(--ink-soft); }

  .controls { margin-top: 1rem; display: flex; justify-content: center; align-items: center; gap: 1rem; font-size: 0.9rem; color: var(--ink-soft); }
  .pill {
    font: inherit;
    color: var(--ink);
    background: transparent;
    border: 1.5px solid var(--string);
    border-radius: 999px;
    padding: 0.25rem 0.9rem;
    cursor: pointer;
  }
  .pill:focus-visible { outline: 3px solid var(--rose); outline-offset: 3px; }

  /* ---------- letter ---------- */
  .note { max-width: 34rem; margin: 0 auto; padding: 1rem 1.5rem 4.5rem; }
  .note h2 { font-family: var(--serif); font-weight: 700; font-size: 1.6rem; margin: 0 0 1.25rem; }
  .note p { font-family: var(--serif); font-weight: 500; font-size: 1.1rem; line-height: 1.95; margin: 0 0 1rem; }
  .note .salute { font-weight: 700; font-size: 1.25rem; color: var(--rose); }
  .note .sign { color: var(--ink-soft); margin-top: 1.75rem; text-align: right; }

  /* ---------- floating hearts ---------- */
  .hearts { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
  .fh { position: absolute; display: block; }
  .fh svg { display: block; width: 100%; height: 100%; }

  @keyframes sway {
    from { transform: rotate(-1.6deg); }
    to   { transform: rotate(1.6deg); }
  }
  @keyframes swing {
    0%   { transform: rotate(0); }
    12%  { transform: rotate(14deg); }
    28%  { transform: rotate(-11deg); }
    44%  { transform: rotate(7deg); }
    60%  { transform: rotate(-4deg); }
    78%  { transform: rotate(2deg); }
    100% { transform: rotate(0); }
  }
  @keyframes beat {
    0%, 55%, 100% { transform: scale(1); }
    15% { transform: scale(1.25); }
    30% { transform: scale(1); }
    42% { transform: scale(1.15); }
  }
  @media (prefers-reduced-motion: reduce) {
    .chime, .hang.ring, .beat svg { animation: none; }
    .hearts { display: none; }
  }
  @media (max-width: 420px) {
    .bell { width: 52px; height: 62px; }
    .chimes { min-height: 13rem; }
  }
</style>
</head>
<body>

<main>
  <section class="stage" aria-labelledby="name">
    <div class="beam" aria-hidden="true"></div>
    <ul class="chimes" id="chimes"></ul>

    <h1 id="name">玲玲宝贝</h1>

    <div class="beat" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    </div>

    <p class="hello">
      <span class="zh" lang="zh">生日快乐</span>
      <span class="sub">亲爱的，今天你最大</span>
    </p>

    <div class="wish" id="wish" aria-live="polite">
      <p class="wish-zh" lang="zh" id="wishZh">叮铃铃</p>
      <p class="wish-line" id="wishLine">轻点风铃，听它响起。</p>
    </div>

    <div class="controls">
      <span id="progress">已敲响 0 / 5 个风铃</span>
      <button class="pill" id="soundBtn" type="button" aria-pressed="true">声音：开</button>
    </div>
  </section>

  <section class="note" aria-labelledby="noteTitle">
    <h2 id="noteTitle">写给你的信</h2>
    <p class="salute" lang="zh">玲玲宝贝，</p>
    <p>生日快乐。想说的话太多了，写着写着就会越写越长，所以我只说最简单的一句：有你在，平凡的日子也像是为我们准备好的。</p>
    <p>谢谢你的笑声，谢谢你的耐心，谢谢你走进哪个房间，哪里就变得温暖。不管这一年会带来什么，我都希望它把你抱得紧紧的，也希望我一直在你身边。</p>
    <p class="sign">永远爱你</p>
  </section>
</main>

<div class="hearts" id="hearts" aria-hidden="true"></div>

<script>
  var HEART_PATH = "M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z";
  var HEART_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="' + HEART_PATH + '"/></svg>';
  var HEART_COLORS = ["#E0577A", "#F4A3B7", "#E9BC6C", "#D6336C"];

  var BELLS = [
    { zh: "爱你", en: "我爱你。不只是今天，而是每一个平凡的日子。",       freq: 659.25, color: "var(--rose)", text: "#FFFFFF", len: 46,  dur: 6.4, delay: -1.0 },
    { zh: "心动", en: "每一次看见你，我的心还是会漏跳一拍。",              freq: 523.25, color: "var(--gold)", text: "#4A1A2C", len: 120, dur: 5.2, delay: -3.1 },
    { zh: "甜蜜", en: "愿你的这一年，像你带给我的日子一样甜。",                    freq: 783.99, color: "var(--pink)", text: "#4A1A2C", len: 74,  dur: 7.0, delay: -2.2 },
    { zh: "相伴", en: "无论这一年去往哪里，我都想和你一起。",            freq: 587.33, color: "var(--rose)", text: "#FFFFFF", len: 150, dur: 5.8, delay: -4.4 },
    { zh: "永远", en: "敬往后的每一个生日，我们都在彼此身边。",                   freq: 880.00, color: "var(--gold)", text: "#4A1A2C", len: 96,  dur: 6.8, delay: -0.4 }
  ];

  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var chimesEl = document.getElementById("chimes");
  var wishEl = document.getElementById("wish");
  var wishZh = document.getElementById("wishZh");
  var wishLine = document.getElementById("wishLine");
  var progressEl = document.getElementById("progress");
  var soundBtn = document.getElementById("soundBtn");
  var heartsEl = document.getElementById("hearts");
  var hangs = [];
  var rung = {};
  var rungCount = 0;
  var finished = false;
  var soundOn = true;
  var audio = null;

  function bellSvg(b) {
    return '' +
      '<svg class="bell" viewBox="0 0 64 76" aria-hidden="true" focusable="false" style="--c:' + b.color + ';--tc:' + b.text + '">' +
        '<circle cx="32" cy="5" r="4" fill="none" stroke="var(--string)" stroke-width="2"/>' +
        '<path class="body" d="M32 10 C20 10 16 22 15 36 C14 48 9 52 6 58 L58 58 C55 52 50 48 49 36 C48 22 44 10 32 10 Z"/>' +
        '<rect class="rim" x="4" y="56" width="56" height="6" rx="3"/>' +
        '<path class="shine" d="M24 16 C19 20 18 28 18 36 C19 30 21 24 27 18 Z"/>' +
        '<text x="32" y="46">' + b.zh + '</text>' +
        '<path class="clapper" transform="translate(26 63) scale(.5)" d="' + HEART_PATH + '"/>' +
      '</svg>';
  }

  BELLS.forEach(function (b, i) {
    var li = document.createElement("li");
    li.className = "chime";
    li.style.setProperty("--dur", b.dur + "s");
    li.style.setProperty("--delay", b.delay + "s");
    li.style.setProperty("--len", b.len + "px");

    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "hang";
    btn.setAttribute("aria-label", "敲响风铃：" + b.zh);
    btn.innerHTML = '<span class="string"></span>' + bellSvg(b);
    btn.addEventListener("click", function () { ring(i); });

    li.appendChild(btn);
    chimesEl.appendChild(li);
    hangs.push(btn);
  });

  function tone(freq) {
    if (!soundOn) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!audio) audio = new AC();
      if (audio.state === "suspended") audio.resume();
      var now = audio.currentTime;
      var master = audio.createGain();
      master.gain.value = 0.22;
      master.connect(audio.destination);
      // Inharmonic partials give a small metal-bell shimmer.
      [[1, 0.6, 3.2], [2.76, 0.28, 2.0], [5.4, 0.12, 1.2], [8.93, 0.05, 0.7]].forEach(function (p) {
        var osc = audio.createOscillator();
        var g = audio.createGain();
        osc.type = "sine";
        osc.frequency.value = freq * p[0];
        g.gain.setValueAtTime(0.0001, now);
        g.gain.exponentialRampToValueAtTime(p[1], now + 0.008);
        g.gain.exponentialRampToValueAtTime(0.0001, now + p[2]);
        osc.connect(g);
        g.connect(master);
        osc.start(now);
        osc.stop(now + p[2] + 0.05);
      });
    } catch (e) { /* sound is optional */ }
  }

  function setWish(zh, en) {
    wishZh.textContent = zh;
    wishLine.textContent = en;
    if (!reduceMotion && wishEl.animate) {
      wishEl.animate(
        [{ opacity: 0, transform: "translateY(6px)" }, { opacity: 1, transform: "none" }],
        { duration: 300, easing: "ease-out" }
      );
    }
  }

  // One heart drifting up from a point, then gone.
  function floatHeart(x, y, delay) {
    var h = document.createElement("span");
    var size = 12 + Math.random() * 14;
    var dx = (Math.random() - 0.5) * 100;
    var rise = 130 + Math.random() * 100;
    h.className = "fh";
    h.innerHTML = HEART_SVG;
    h.style.left = x + "px";
    h.style.top = y + "px";
    h.style.width = size + "px";
    h.style.height = size + "px";
    h.style.color = HEART_COLORS[Math.floor(Math.random() * HEART_COLORS.length)];
    heartsEl.appendChild(h);
    var a = h.animate([
      { transform: "translate(-50%, -50%) scale(.4)", opacity: 0 },
      { transform: "translate(-50%, -50%) scale(1)", opacity: 1, offset: 0.15 },
      { transform: "translate(calc(-50% + " + dx + "px), calc(-50% - " + rise + "px)) scale(1)", opacity: 0 }
    ], { duration: 1800 + Math.random() * 900, delay: delay, easing: "ease-out", fill: "both" });
    a.onfinish = function () { h.remove(); };
  }

  function burst(btn) {
    if (reduceMotion || !btn.animate) return;
    var r = btn.querySelector(".bell").getBoundingClientRect();
    for (var n = 0; n < 5; n++) floatHeart(r.left + r.width / 2, r.top + r.height * 0.7, n * 90);
  }

  // Falling hearts for the finale.
  function rainHeart(delay) {
    var h = document.createElement("span");
    var size = 12 + Math.random() * 16;
    var dx = (Math.random() - 0.5) * 120;
    h.className = "fh";
    h.innerHTML = HEART_SVG;
    h.style.left = (Math.random() * 100) + "%";
    h.style.top = "0px";
    h.style.width = size + "px";
    h.style.height = size + "px";
    h.style.color = HEART_COLORS[Math.floor(Math.random() * HEART_COLORS.length)];
    h.style.opacity = (0.6 + Math.random() * 0.4).toFixed(2);
    heartsEl.appendChild(h);
    var a = h.animate([
      { transform: "translate(0, -30px) rotate(0deg)" },
      { transform: "translate(" + dx + "px, " + (window.innerHeight + 40) + "px) rotate(" + ((Math.random() - 0.5) * 120) + "deg)" }
    ], { duration: 5000 + Math.random() * 4000, delay: delay, easing: "linear", fill: "both" });
    a.onfinish = function () { h.remove(); };
  }

  function ring(i) {
    var b = BELLS[i];
    tone(b.freq);
    var el = hangs[i];
    el.classList.remove("ring");
    void el.offsetWidth;
    el.classList.add("ring");
    burst(el);

    if (!finished) setWish(b.zh, b.en);

    if (!rung[i]) {
      rung[i] = true;
      rungCount += 1;
      progressEl.textContent = "已敲响 " + rungCount + " / 5 个风铃";
      if (rungCount === BELLS.length && !finished) {
        finished = true;
        setTimeout(finale, 1800);
      }
    }
  }

  function finale() {
    setWish("生日快乐，玲玲宝贝", "五个风铃都响了。生日快乐，我的宝贝，我爱你。");
    progressEl.textContent = "五个风铃都敲响了";
    if (reduceMotion) return;
    for (var n = 0; n < 32; n++) rainHeart(Math.random() * 2000);
  }

  soundBtn.addEventListener("click", function () {
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? "声音：开" : "声音：关";
    soundBtn.setAttribute("aria-pressed", String(soundOn));
  });
</script>
</body>
</html>
